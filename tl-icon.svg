<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#2456d6"/>
      <stop offset="1" stop-color="#1c8fb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 未記録の時間を表す薄いトラック -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="46"/>

  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="168" fill="none" stroke="#3b82f6"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="192.11 863.46"
    transform="rotate(-90.00 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#14b8a6"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="107.67 947.91"
    transform="rotate(-18.00 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#f5b301"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="76.00 979.57"
    transform="rotate(25.20 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#16a34a"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="128.78 926.79"
    transform="rotate(57.60 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#7c6cf0"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="86.56 969.02"
    transform="rotate(108.00 256 256)"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="#f2683c"
    stroke-width="46" stroke-linecap="round"
    stroke-dasharray="76.00 979.57"
    transform="rotate(144.00 256 256)"/>
  </g>

  <!-- 文字盤の目盛り(12/3/6/9) -->
  <line x1="256.0" y1="125.0"
      x2="256.0" y2="141.0"
      stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <line x1="387.0" y1="256.0"
      x2="371.0" y2="256.0"
      stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <line x1="256.0" y1="387.0"
      x2="256.0" y2="371.0"
      stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <line x1="125.0" y1="256.0"
      x2="141.0" y2="256.0"
      stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>

  <!-- 時計の針 10:10 -->
  <line x1="256" y1="256" x2="188.5" y2="217.0"
    stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="349.5" y2="202.0"
    stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
  <circle cx="256" cy="256" r="7" fill="#2456d6"/>
</svg>